name: 🏀 NBA Daily Newsletter

on:
  schedule:
    # Objectif : mail à 7 h 45 à Paris. Les tâches planifiées de GitHub partent avec des heures de retard le matin
    # (4 à 6 h constatées), mais à l'heure le soir. Le run du soir attend donc sur place (5 h 40 au plus, un run
    # GitHub est limité à 6 h), puis se relance lui-même (« relais » : un lancement manuel démarre tout de suite)
    # jusqu'à 7 h 40, prépare le récap et l'envoie. Les déclenchements du matin servent de filet de sécurité.
    - cron: '23 19-23 * * *'
    - cron: '23 0-6 * * *'

  workflow_dispatch:
    inputs:
      relay:
        description: "Relais automatique (attendre 7 h 40). Laisser décoché pour envoyer tout de suite."
        type: boolean
        default: false

# Un seul run à la fois : celui qui attend garde la main, les suivants passent après et voient « déjà envoyé ».
concurrency:
  group: nba-daily
  cancel-in-progress: false

jobs:
  nba-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      actions: write   # pour se relancer (relais)
      contents: read

    steps:
      - name: 📅 Date du jour à Paris
        id: day
        run: echo "today=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"

      - name: 🔁 Récap du jour déjà envoyé ?
        id: sent_today
        uses: actions/cache/restore@v4
        with:
          path: .sent
          key: nba-sent-${{ steps.day.outputs.today }}
          lookup-only: true

      - name: ⏰ Attendre 7 h 40 à Paris
        id: gate
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && !inputs.relay }}
          SENT_TODAY: ${{ steps.sent_today.outputs.cache-hit == 'true' }}
        run: |
          go=false; relay=false
          if [ "$MANUAL" = "true" ]; then
            go=true
          else
            now=$(date +%s)
            today740=$(TZ=Europe/Paris date -d "today 07:40" +%s)
            if [ "$now" -lt "$today740" ]; then target=$today740
            elif [ "$SENT_TODAY" != "true" ]; then target=$now            # en retard et pas encore envoyé : tout de suite
            else target=$(TZ=Europe/Paris date -d "tomorrow 07:40" +%s)
            fi
            wait=$((target - now))
            if [ "$wait" -gt 43200 ]; then
              echo "Envoi dans plus de 12 h : rien à faire, les déclenchements du soir s'en chargeront."
            elif [ "$wait" -le 20400 ]; then
              if [ "$wait" -gt 0 ]; then echo "Attente de $((wait / 60)) min…"; sleep "$wait"; fi
              go=true
            else
              nap=$((wait - 20000)); [ "$nap" -gt 20400 ] && nap=20400
              echo "Envoi dans $((wait / 60)) min : attente de $((nap / 60)) min puis relais."
              sleep "$nap"
              relay=true
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "relay=$relay" >> "$GITHUB_OUTPUT"
          echo "today=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"

      - name: 🔂 Relais
        if: steps.gate.outputs.relay == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nba-daily.yml --repo "${{ github.repository }}" -f relay=true

      - name: 🔁 Déjà envoyé aujourd'hui ?
        id: sent
        if: steps.gate.outputs.go == 'true' && !(github.event_name == 'workflow_dispatch' && !inputs.relay)
        uses: actions/cache/restore@v4
        with:
          path: .sent
          key: nba-sent-${{ steps.gate.outputs.today }}

      - name: 📥 Checkout repository
        if: steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/checkout@v5

      - name: 🐍 Setup Python 3.11
        if: steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        if: steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: 🚀 Generate and send newsletter
        if: steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          NEWS_RECIPIENT: ${{ secrets.NEWS_RECIPIENT }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          BOT_RUN_TIME: ${{ secrets.BOT_RUN_TIME }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          # Rédaction par Claude (abonnement), Hugging Face en secours
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: claude-sonnet-5-5
          USE_HF_INF_API: ${{ secrets.USE_HF_INF_API }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          MODEL_ID: moonshotai/Kimi-K3
          MODEL_FALLBACKS: deepseek-ai/DeepSeek-V4.1-Flash,zai-org/GLM-5.3
          MAX_TOKENS: ${{ secrets.MAX_TOKENS }}
          CACHE_PATH: ${{ secrets.CACHE_PATH }}
        run: |
          python run.py once

      - name: 📌 Marquer comme envoyé
        if: success() && steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        run: mkdir -p .sent && date > .sent/stamp

      - name: 💾 Mémoriser l'envoi du jour
        if: success() && steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sent
          key: nba-sent-${{ steps.gate.outputs.today }}

      - name: 📤 Upload newsletter output
        if: always() && steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: newsletter
          path: out/
          retention-days: 30
          if-no-files-found: ignore  # Ne pas échouer si aucun fichier (ex: pas de matchs)

      - name: 🚨 Alert by email on failure
        if: failure()
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          NEWS_RECIPIENT: ${{ secrets.NEWS_RECIPIENT }}
        run: |
          [ -f .github/scripts/notify_failure.py ] || git clone --depth 1 "https://github.com/${{ github.repository }}" .
          python .github/scripts/notify_failure.py

  # Empêche GitHub de désactiver ce workflow après 60 jours sans commit
  keepalive:
    if: github.event.schedule == '23 19-23 * * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: ♻️ Keep workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nba-daily.yml/enable"
