name: 🏀 NBA Daily Newsletter

on:
  schedule:
    # Objectif : 7 h 45 à Paris toute l'année. GitHub ne connaît que l'UTC et ignore le changement
    # d'heure, donc deux déclenchements : 05:47 UTC (= 7 h 47 en été) et 06:47 UTC (= 7 h 47 en hiver).
    # L'étape « Heure de Paris » laisse passer le bon et la marque « déjà envoyé » évite tout doublon.
    # Minutes « impaires » exprès : à l'heure pile, GitHub retarde les tâches planifiées de plusieurs heures.
    - cron: '47 5 * * *'
    - cron: '47 6 * * *'

  # Lancement à la main (toujours envoyé)
  workflow_dispatch:

jobs:
  nba-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ⏰ Heure de Paris
        id: gate
        run: |
          now=$(TZ=Europe/Paris date +%H%M)
          echo "today=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$((10#$now))" -ge 730 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Il est $now à Paris : trop tôt, l'autre déclenchement s'en charge."
          fi

      - name: 🔁 Déjà envoyé aujourd'hui ?
        id: sent
        if: steps.gate.outputs.go == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .sent
          key: nba-sent-${{ steps.gate.outputs.today }}

      - name: 📥 Checkout repository
        if: steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/checkout@v5

      - name: 🐍 Setup Python 3.11
        if: steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        if: steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements.txt

      - name: 🚀 Generate and send newsletter
        if: steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          NEWS_RECIPIENT: ${{ secrets.NEWS_RECIPIENT }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          BOT_RUN_TIME: ${{ secrets.BOT_RUN_TIME }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          USE_HF_INF_API: ${{ secrets.USE_HF_INF_API }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          # Modèle principal puis secours (HF Inference Providers)
          MODEL_ID: moonshotai/Kimi-K3
          MODEL_FALLBACKS: deepseek-ai/DeepSeek-V4.1-Flash,zai-org/GLM-5.3
          MAX_TOKENS: ${{ secrets.MAX_TOKENS }}
          CACHE_PATH: ${{ secrets.CACHE_PATH }}
        run: |
          python run.py once

      - name: 📌 Marquer comme envoyé
        if: success() && steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true' && github.event_name != 'workflow_dispatch'
        run: mkdir -p .sent && date > .sent/stamp

      - name: 💾 Mémoriser l'envoi du jour
        if: success() && steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: .sent
          key: nba-sent-${{ steps.gate.outputs.today }}

      - name: 📤 Upload newsletter output
        if: always() && steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: newsletter
          path: out/
          retention-days: 30
          if-no-files-found: ignore  # Ne pas échouer si aucun fichier (ex: pas de matchs)

      - name: 🚨 Alert by email on failure
        if: failure()
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          NEWS_RECIPIENT: ${{ secrets.NEWS_RECIPIENT }}
        run: python .github/scripts/notify_failure.py

  # Empêche GitHub de désactiver ce workflow après 60 jours sans commit
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: ♻️ Keep workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nba-daily.yml/enable"
