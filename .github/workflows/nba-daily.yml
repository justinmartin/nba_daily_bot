name: 🏀 NBA Daily Newsletter

on:
  schedule:
    # Run every day at 10:30 AM UTC
    # This is 11:30 AM Paris time in winter (UTC+1)
    # This is 12:30 PM Paris time in summer (UTC+2)
    - cron: '30 10 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  nba-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Increased to 30 minutes to handle slow NBA API
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
      
      - name: 🚀 Generate and send newsletter
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          NEWS_RECIPIENT: ${{ secrets.NEWS_RECIPIENT }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          BOT_RUN_TIME: ${{ secrets.BOT_RUN_TIME }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          USE_HF_INF_API: ${{ secrets.USE_HF_INF_API }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          MODEL_ID: ${{ secrets.MODEL_ID }}
          MAX_TOKENS: ${{ secrets.MAX_TOKENS }}
          CACHE_PATH: ${{ secrets.CACHE_PATH }}
        run: |
          python run.py once
      
      - name: 📤 Upload newsletter output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter
          path: out/
          retention-days: 30
          if-no-files-found: ignore  # Ne pas échouer si aucun fichier (ex: pas de matchs)
      
      - name: 📊 Show logs
        if: failure()
        run: |
          echo "❌ Newsletter generation failed. Check logs above."
          exit 1
