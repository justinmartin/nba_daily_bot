name: 🏀 NBA Daily Newsletter

on:
  schedule:
    # Objectif : mail à 7 h 45 à Paris. Les tâches planifiées de GitHub partent avec plusieurs heures de retard
    # (4 à 6 h constatées le matin), donc on en lance une par heure à partir de la veille au soir : la première
    # qui démarre moins de 5 h 40 avant l'envoi attend 7 h 40, prépare le récap et l'envoie. Les suivantes voient
    # « déjà envoyé » et s'arrêtent en quelques secondes. Été comme hiver (l'heure de Paris est calculée).
    - cron: '23 20-23 * * *'
    - cron: '23 0-6 * * *'

  # Lancement à la main (envoi immédiat)
  workflow_dispatch:

# Un seul run à la fois : celui qui attend garde la main, le suivant passe après et voit « déjà envoyé ».
concurrency:
  group: nba-daily
  cancel-in-progress: false

jobs:
  nba-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: ⏰ Attendre 7 h 40 à Paris
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            now=$(date +%s)
            # Démarré le soir (après 18 h à Paris) : l'envoi visé est celui du lendemain matin
            if [ "$(TZ=Europe/Paris date +%-H)" -ge 18 ]; then day=tomorrow; else day=today; fi
            target=$(TZ=Europe/Paris date -d "$day 07:40" +%s)
            wait=$((target - now))
            if [ "$wait" -gt 20400 ]; then
              echo "Trop tôt ($((wait / 60)) min avant l'envoi) : un déclenchement suivant s'en chargera."
              echo "go=false" >> "$GITHUB_OUTPUT"
            else
              if [ "$wait" -gt 0 ]; then echo "Attente de $((wait / 60)) min…"; sleep "$wait"; fi
              echo "go=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "today=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"

      - name: 🔁 Déjà envoyé aujourd'hui ?
        id: sent
        if: steps.gate.outputs.go == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .sent
          key: nba-sent-${{ steps.gate.outputs.today }}

      - name: 📥 Checkout repository
        if: steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/checkout@v5

      - name: 🐍 Setup Python 3.11
        if: steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        if: steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: 🚀 Generate and send newsletter
        if: steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          NEWS_RECIPIENT: ${{ secrets.NEWS_RECIPIENT }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          BOT_RUN_TIME: ${{ secrets.BOT_RUN_TIME }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          # Rédaction par Claude (abonnement), Hugging Face en secours
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: claude-sonnet-5-5
          USE_HF_INF_API: ${{ secrets.USE_HF_INF_API }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          MODEL_ID: moonshotai/Kimi-K3
          MODEL_FALLBACKS: deepseek-ai/DeepSeek-V4.1-Flash,zai-org/GLM-5.3
          MAX_TOKENS: ${{ secrets.MAX_TOKENS }}
          CACHE_PATH: ${{ secrets.CACHE_PATH }}
        run: |
          python run.py once

      - name: 📌 Marquer comme envoyé
        if: success() && steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true' && github.event_name != 'workflow_dispatch'
        run: mkdir -p .sent && date > .sent/stamp

      - name: 💾 Mémoriser l'envoi du jour
        if: success() && steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: .sent
          key: nba-sent-${{ steps.gate.outputs.today }}

      - name: 📤 Upload newsletter output
        if: always() && steps.gate.outputs.go == 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: newsletter
          path: out/
          retention-days: 30
          if-no-files-found: ignore  # Ne pas échouer si aucun fichier (ex: pas de matchs)

      - name: 🚨 Alert by email on failure
        if: failure()
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          NEWS_RECIPIENT: ${{ secrets.NEWS_RECIPIENT }}
        run: |
          [ -f .github/scripts/notify_failure.py ] || git clone --depth 1 "https://github.com/${{ github.repository }}" .
          python .github/scripts/notify_failure.py

  # Empêche GitHub de désactiver ce workflow après 60 jours sans commit (une fois par jour suffit)
  keepalive:
    if: github.event.schedule == '23 20-23 * * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: ♻️ Keep workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nba-daily.yml/enable"
