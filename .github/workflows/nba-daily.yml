name: 🏀 NBA Daily Newsletter

on:
  schedule:
    # 05:37 UTC = 6 h 37 à Paris en hiver, 7 h 37 en été : les derniers matchs (côte Ouest) sont finis.
    # Minute « impaire » exprès : à l'heure pile, GitHub retarde les tâches planifiées de plusieurs heures
    # (le cron de 07:00 partait en réalité entre 11 h et 15 h UTC).
    - cron: '37 5 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  nba-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
      
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: 🚀 Generate and send newsletter
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          NEWS_RECIPIENT: ${{ secrets.NEWS_RECIPIENT }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          BOT_RUN_TIME: ${{ secrets.BOT_RUN_TIME }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          USE_HF_INF_API: ${{ secrets.USE_HF_INF_API }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          # Modèle principal puis secours (HF Inference Providers)
          MODEL_ID: moonshotai/Kimi-K3
          MODEL_FALLBACKS: deepseek-ai/DeepSeek-V4.1-Flash,zai-org/GLM-5.3
          MAX_TOKENS: ${{ secrets.MAX_TOKENS }}
          CACHE_PATH: ${{ secrets.CACHE_PATH }}
        run: |
          python run.py once
      
      - name: 📤 Upload newsletter output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: newsletter
          path: out/
          retention-days: 30
          if-no-files-found: ignore  # Ne pas échouer si aucun fichier (ex: pas de matchs)
      
      - name: 🚨 Alert by email on failure
        if: failure()
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          NEWS_RECIPIENT: ${{ secrets.NEWS_RECIPIENT }}
        run: python .github/scripts/notify_failure.py

  # Empêche GitHub de désactiver ce workflow après 60 jours sans commit
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: ♻️ Keep workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nba-daily.yml/enable"
